; FluidMotionNPC - NPC terrain traversal only. Re-read every time you load a save.
; Stripped fork of Fluid Motion: Pathfinding Overhaul (megakuutti, GPL-3.0).
; The player, camera, combat AI, spiders and vanilla pathfinding are never touched.
; Log: Documents\My Games\Skyrim Special Edition\SKSE\FluidMotionNPC.log

[General]
; false = plugin loads but does nothing.
bEnabled = true

[Jump]
; NPC jump traversal. Distances in game units (70 u ~ 1 m).
bEnabled = true
; Jump across a long detour of the NPC's own path (fence, ledge, gap) to a node further along it.
bShortcut = true
; Melee attacker that can't get closer to a target standing clearly above/below it jumps beside it.
bPursuit = false
; Same for a follower stuck below or above the player.
bFollow = true
; NPCs climb ledges they can (about knee to shoulder height, fairly flat top) and jump where they can't
; (taller ledges, gaps, sloped rock). Set to false to stop them jumping: they then only walk, route and climb.
; bFollowerJumps = your followers, bCombatJumps = any NPC in combat.
bFollowerJumps = true
bCombatJumps = true
; Route on foot (with jumps/climbs) when the navmesh can't reach the target.
bRoute = true
; Gravity of the planned arc (u/s2). Real gravity is ~686; higher looks snappier.
fGravity = 900
; Max rise above the take-off point = actor height x fUpPerHeight, clamped to [fUpMin, fUpMax].
fUpPerHeight = 1.15
fUpMin = 60
fUpMax = 180
; Max drop.
fDownMax = 450
; Max horizontal distance = actor height x fDistPerHeight, clamped to [fDistMin, fDistMax].
fDistPerHeight = 2.0
fDistMin = 150
fDistMax = 350
; Taller actors never jump.
fMaxActorHeight = 300
; Shortcut only when it saves at least fMinSaving of path and path/jump length >= fMinRatio.
fMinSaving = 300
fMinRatio = 1.6
; Same for a follower catching up with the player (it takes shortcuts more readily).
fFollowMinSaving = 160
fFollowMinRatio = 1.3
; A follower close behind you (within fFollowRouteMin) vaults level obstacles - tables, fences, low walls - when
; walking around is at least fFollowVaultMinRatio times longer and saves fFollowVaultMinSaving units. The landing
; must be within fFollowVaultMaxDz of the take-off height, so close followers still never jump up stairs or slopes.
bFollowVault = true
fFollowVaultMinSaving = 95
fFollowVaultMinRatio = 1.5
fFollowVaultMaxDz = 36
; When a route meets a low obstacle (up to fVaultMaxFrac x the NPC's height: tables, benches, fences) with free floor
; behind it within fVaultMaxDz of the same level, the NPC vaults over it instead of climbing onto it.
bVault = true
fVaultMaxFrac = 0.6
fVaultMaxDz = 40
; Horizontal launch speed range.
fMinSpeed = 250
fMaxSpeed = 600
; Feet clearance over obstacles along the arc.
fClearance = 12
; Seconds before the same NPC may jump again.
fCooldown = 1.5
; NPCs moved by hand (route legs, jump arcs) turn at most this fast (deg/s) and speed up at fGlideAccel (u/s2).
fTurnRateDeg = 420
fGlideAccel = 700
; A follower is only routed when this far from the player and standing still (vanilla can't reach).
; Closer than this, a following follower also never takes shortcut jumps (it just walks, e.g. on stairs).
fFollowRouteMin = 350
; Driven NPCs follow the ground height at most this fast (u/s) up and down.
fDriveRise = 220
fDriveFall = 500
; Pursuit/follow fire after this many seconds without getting closer to the target.
; A follower also has to be stuck in place (barely moved for half a second) before it climbs, jumps or routes.
fPursuitStuckSec = 1.0
fFollowStuckSec = 1.0
; Pursuit only when the target is at least this much higher, or fPursuitMinDrop lower.
fPursuitMinRise = 70
fPursuitMinDrop = 120
; A melee NPC counts as "in reach" of a target up to this many body heights above it.
fMeleeRise = 0.75
; 0 = each frame set position, velocity and the in-air state; 1 = position only.
iDriveMode = 0
; Horses and giants are always left alone (not configurable).
; Races that never jump (they still route on foot): case-insensitive parts of the race editor ID.
sExcludeRaces = Dragon,Alduin,Mammoth,Horker,Mudcrab,Slaughterfish,Centurion,Sphere,Wisp,Netch,Fish,Torchbug,Moth,Butterfly,Dragonfly,Hawk,Crow,Chicken,Cow,Goat
; Races that neither jump nor route (fliers, swimmers).
sNoRouteRaces = Dragon,Alduin,Slaughterfish,Fish,Wisp,Netch,Torchbug,Moth,Butterfly,Dragonfly,Hawk,Crow
; Non-NPC races that get the human climb clip and jump animation (never above fGiantHeight).
sClimbRaces = Draugr,Falmer,Hagraven,Forsworn,Skeleton
; Races that route up steep ground (rise per walk edge fSteepRise, cost x fSteepCost).
sSteepRaces = Bear,Spider,Chaurus,Sabre,Goat,Troll
fSteepRise = 130
fSteepCost = 1.4
; Routes wade through water up to this fraction of body height deep (0 = never), at this cost multiplier.
fWadeDepth = 0.45
fWadeCost = 1.5
; Idle melee NPC whose target is more than this many body heights below (or half above) routes to its level.
fVertMismatch = 1.0
; Actors taller than this (giants) jump higher and further than the normal caps.
fGiantHeight = 220
fGiantDistMax = 700
fGiantUpPerHeight = 1.4
fGiantDistPerHeight = 2.6
; Creatures (trolls, bears, wolves... any non-humanoid race) jump this much as high and far as their size
; allows. 1.0 = same rule as people. Lower it (e.g. 0.75) if big creatures reach cliffs that feel safe.
; Below about 0.25 most creatures stop jumping entirely.
fCreatureJumpScale = 1.0
;
; Deep scan (EXPERIMENTAL, optional test build). When an NPC's normal routes to the same target fail
; iDeepScanAfter times in a row (e.g. a troll pacing below the cliff you are standing on), it maps the
; ground around it and its target with downward raycasts (one per fDeepScanCell units, iDeepScanRays per
; frame, at most iDeepScanMaxCells per side) and plans a walk/jump way up on that map. If there is no way,
; it stops trying for fDeepScanPause seconds instead of rubbing along the wall. Outdoors only. One scan at
; a time. bLog shows DEEPSCAN lines and routes with why=deepscan.
bDeepScan = true
iDeepScanAfter = 2
fDeepScanCell = 32
iDeepScanMaxCells = 96
iDeepScanRays = 400
fDeepScanPause = 15
; Before a deep-scan route is used, each jump and walking step is checked with the same precise tests the
; NPC will face (take-off/landing re-sampled at 8u). A failing one is taken out and the route re-planned on
; the same map, up to this many times.
iDeepScanRetries = 5
; Behaviour-graph events sent at take-off and landing. Humanoids share the player's graph; most
; creatures have no jump animation, so they keep their run animation through the arc.
sNpcStartEvent = JumpDirectionalStart
sNpcLandEvent = JumpLand
sCreatureStartEvent =
sCreatureLandEvent =
; JUMP / LAND / ROUTE lines in the log.
bLog = false

[Anim]
; Climb / ledge-hang / jump clips on NPCs while they traverse. The player is never posed.
bEnabled = true
bNpcs = true
; NPCs within this distance of the player start climbs on their own when a ledge blocks them.
fRadius = 1800
iMaxActors = 24
; Play the jump clips during jump arcs.
bJumpPose = true
; NPC in a hurry (combat, fleeing, running) blocked by an obstacle between fClimbMin and fClimbMaxFrac x height climbs it.
; Using Follower Parkour too? FluidMotionNPC already waits while a follower is mid-parkour. For a clean split
; (Follower Parkour does all ledge climbs, FluidMotionNPC does routes, gap jumps and catching up) set bClimb = false.
bClimb = true
fClimbMin = 38
; 1.0 = up to the NPC's own height. Above ~1.1 the hands no longer reach the top.
fClimbMaxFrac = 1.0
; Seconds to get hands-on-ledge, seconds to blend back to the graph at the end, clip playback speed.
fClimbApproach = 0.1
fClimbTail = 0.35
fClimbRate = 1.2
; After a jump, a ledge a little above head height: hang from it and pull up.
bHang = true
fHangTail = 0.55
bLog = false
