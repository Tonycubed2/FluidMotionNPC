name: Upload to Nexus Mods

# Manual release: Actions tab -> "Upload to Nexus Mods" -> Run workflow.
# Takes the latest CI build (ci-out branch), checks it was built from the current main and contains the DLL and the
# INI, packages it exactly like scripts/package.sh, and uploads it as a new version of the main file on Nexus.
#
# Needs, in the "nexus" environment (Settings -> Environments -> nexus):
#   secret   NEXUSMODS_API_KEY  - personal API key from nexusmods.com/settings/api-keys
#   variable NEXUSMODS_FILE_ID  - "File ID" of the main file (Files tab -> Advanced -> API), 8170245
#   variable NEXUSMODS_MOD_ID   - optional, "Unique Mod ID" (same dialog); default 7318624467660

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown on Nexus (e.g. 25)"
        required: true
      changelog:
        description: "Changelog text (optional, plain text; use ' | ' to separate lines)"
        required: false
        default: ""
      file_id:
        description: "Nexus File ID of the main file (Files tab -> Advanced -> API -> File ID)"
        required: false
        default: "8170245"
      display_name:
        description: "File name shown on Nexus"
        required: false
        default: "FluidMotionNPC"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: nexus
    steps:
      - name: Check settings
        env:
          FILE_ID: ${{ inputs.file_id || vars.NEXUSMODS_FILE_ID }}
          HAS_KEY: ${{ secrets.NEXUSMODS_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "::error::Secret NEXUSMODS_API_KEY is missing in the nexus environment"; exit 1; fi
          if [ -z "$FILE_ID" ]; then echo "::error::Variable NEXUSMODS_FILE_ID is missing in the nexus environment"; exit 1; fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Check out latest build (ci-out)
        uses: actions/checkout@v4
        with:
          ref: ci-out
          path: build

      - name: Make sure the build matches main and is complete
        run: |
          built=$(tr -cd '0-9a-f' < build/source-commit.txt)
          head=$(git -C main rev-parse --short=7 HEAD)
          echo "main is $head, ci-out was built from $built"
          case "$(git -C main rev-parse HEAD)" in
            "$built"*) ;;
            *) echo "::error::The latest build ($built) is not from the current main ($head). Wait for the Build workflow to finish, then run this again."; exit 1 ;;
          esac
          for f in SKSE/Plugins/FluidMotionNPC.dll SKSE/Plugins/FluidMotionNPC.ini; do
            if [ ! -f "build/$f" ]; then echo "::error::MISSING $f - not uploading"; exit 1; fi
          done

      - name: Package
        run: |
          cd build
          zip -qr ../FluidMotionNPC.zip SKSE LICENSE NOTICE.md THIRD_PARTY_NOTICES.md CommonLibSSE-NG-EXCEPTIONS.md
          cd ..
          unzip -l FluidMotionNPC.zip

      - name: Format changelog
        id: log
        if: ${{ inputs.changelog != '' }}
        env:
          TEXT: ${{ inputs.changelog }}
        run: |
          {
            echo "text<<CHANGELOG_EOF"
            printf '%s\n' "$TEXT" | sed 's/ | /\n/g'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ inputs.file_id || vars.NEXUSMODS_FILE_ID }}
          filename: FluidMotionNPC.zip
          display_name: ${{ inputs.display_name }}
          version: ${{ inputs.version }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID || '7318624467660' }}
          changelog: ${{ steps.log.outputs.text }}
          update_mod_version: true
